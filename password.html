<!DOCTYPE html>
<html lang="de" class="staticrypt-html">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geschützter Bereich | annication</title>
    <meta http-equiv="cache-control" content="no-cache" />
    <link rel="stylesheet" href="/styles/variables.css" />
    <link rel="stylesheet" href="/styles/index.css" />
    <script src="/scripts/content-crypto.js" defer></script>
    <script src="/scripts/password.js" defer></script>
</head>
<body class="staticrypt-body">
    <div id="staticrypt_loading" class="staticrypt-spinner-container" role="status" aria-label="Seite wird geladen">
        <div class="staticrypt-spinner"></div>
    </div>

    <main id="staticrypt_content" class="staticrypt-content hidden">
        <div class="staticrypt-page">
            <section class="staticrypt-card" aria-labelledby="password-title">
                <div class="staticrypt-brand">
                    <h1 id="password-title" class="staticrypt-title">Gleich geht's los!</h1>
                    <p class="staticrypt-instructions">Diese Seite ist vor KI-Scrapern und anderen Web-Crawlern mit einem Passwort geschützt.</p>
                </div>
                <form id="staticrypt-form" action="#" method="post">
                    <label class="staticrypt-label" for="staticrypt-password">Passwort</label>
                    <div class="staticrypt-password-container">
                        <input id="staticrypt-password" type="password" name="password"
                               placeholder="Dein Passwort" autocomplete="current-password" autofocus required />
                        <button id="staticrypt-toggle-password-visibility" class="staticrypt-toggle-password-visibility"
                                type="button" aria-label="Passwort anzeigen" aria-pressed="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <input type="submit" class="staticrypt-decrypt-button" value="Weiterlernen →" />
                    <p id="staticrypt-error" class="staticrypt-error hidden" role="alert">Hm ... Dein Passwort stimmt leider nicht.</p>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
